<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Wishzy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- HEADER -->
  <div id="header-container"></div>

  <!-- MAIN -->
  <main class="page-main" style="min-height:70vh;padding-top:100px;padding-bottom:60px">
    <div class="container" style="max-width:800px;margin:0 auto">
      
      <!-- LOGIN VIEW -->
      <div id="account-login-view" style="text-align:center;padding:60px 40px;background:rgba(253,251,247,0.9);backdrop-filter:blur(20px);border-radius:24px;box-shadow:var(--shadow-lg);border:1px solid rgba(197,139,88,0.2);max-width:500px;margin:0 auto">
        <div style="font-size:3.5rem;margin-bottom:20px">👋</div>
        <h1 style="font-size:2.2rem;margin-bottom:12px;color:var(--clr-text);font-family:var(--font-display)">Welcome Back</h1>
        <p style="color:var(--clr-text-muted);margin-bottom:40px;font-size:1.05rem;line-height:1.6">Enter your mobile number below to securely access your order history and track live shipments.</p>
        
        <form id="login-form" style="max-width:100%;margin:0 auto" onsubmit="event.preventDefault(); WishzyAccount.login();">
          <div class="form-group" style="text-align:left;margin-bottom:24px">
            <label class="form-label" for="login-phone" style="font-weight:600;margin-bottom:8px">Mobile Number</label>
            <input type="tel" class="form-input" id="login-phone" placeholder="e.g., 9876543210" required pattern="[0-9]{10}" style="padding:16px;font-size:1.1rem;border-radius:12px;border:2px solid var(--clr-border);background:white;transition:border-color 0.3s ease">
          </div>
          <button type="submit" class="btn btn--primary btn--full" id="login-btn" style="padding:18px;font-size:1.1rem;border-radius:12px;background:linear-gradient(135deg, var(--clr-accent), var(--clr-accent-dark));box-shadow:var(--shadow-accent)">
            🔓 Secure Login
          </button>
        </form>
      </div>

      <!-- DASHBOARD VIEW (Hidden by default) -->
      <div id="account-dashboard-view" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px">
          <h1 style="font-size:1.8rem;color:var(--clr-text)">My Account</h1>
          <button class="btn btn--ghost" style="font-size:0.85rem;padding:6px 12px" onclick="WishzyAccount.logout()">Logout</button>
        </div>

        <!-- Orders Section -->
        <div style="background:var(--clr-card);border-radius:16px;box-shadow:var(--shadow-sm);border:1px solid var(--clr-border);padding:24px">
          <h2 style="font-size:1.3rem;margin-bottom:20px;color:var(--clr-text);display:flex;align-items:center;gap:10px">
            📦 Recent Orders
            <button id="refresh-orders-btn" class="btn btn--ghost" style="padding:4px 8px;font-size:0.8rem;margin-left:auto" onclick="WishzyAccount.fetchOrders()">🔄 Refresh</button>
          </h2>
          
          <div id="orders-list">
            <!-- Populated via JS -->
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <div id="footer-container"></div>

  <!-- SCRIPTS -->
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
